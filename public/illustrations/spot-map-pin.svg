<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Background -->
  <rect width="200" height="200" fill="#EFF4FF" stroke="none"/>
  <circle cx="100" cy="105" r="74" fill="#FBF9F4" stroke="none"/>
  <circle cx="100" cy="105" r="74"/>

  <!-- Map street grid -->
  <g opacity="0.6" stroke="#94A3B8" stroke-width="1.5">
    <path d="M 38 100 Q 70 96 110 102 T 168 110" fill="none"/>
    <path d="M 50 130 Q 90 122 130 130 T 170 130" fill="none"/>
    <path d="M 70 70 L 76 165" fill="none"/>
    <path d="M 124 70 L 130 165" fill="none"/>
  </g>

  <!-- Mini house 1 -->
  <rect x="46" y="142" width="14" height="12" fill="#EFF4FF"/>
  <rect x="46" y="142" width="14" height="12"/>
  <path d="M 44 142 L 53 134 L 62 142 Z" fill="#1A56DB"/>
  <path d="M 44 142 L 53 134 L 62 142 Z"/>

  <!-- Mini house 2 -->
  <rect x="140" y="138" width="14" height="12" fill="#EFF4FF"/>
  <rect x="140" y="138" width="14" height="12"/>
  <path d="M 138 138 L 147 130 L 156 138 Z" fill="#1A56DB"/>
  <path d="M 138 138 L 147 130 L 156 138 Z"/>

  <!-- Pin -->
  <g transform="translate(100, 100)">
    <!-- Drop shadow -->
    <ellipse cx="0" cy="34" rx="14" ry="3" fill="#0B1F3A" opacity="0.18" stroke="none"/>
    <!-- Pin body -->
    <path d="M 0 30 L -18 -2 Q -18 -28 0 -28 Q 18 -28 18 -2 Z" fill="#1A56DB"/>
    <path d="M 0 30 L -18 -2 Q -18 -28 0 -28 Q 18 -28 18 -2 Z"/>
    <!-- Pin hole -->
    <circle cx="0" cy="-8" r="7" fill="#FBF9F4"/>
    <circle cx="0" cy="-8" r="7"/>
  </g>
</svg>
