<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- soft earth-beige framing ring (mockup's beige illustration band) -->
  <circle cx="120" cy="120" r="106" fill="#EEF1DA"/>
  <!-- white disc -->
  <circle cx="120" cy="120" r="84" fill="#FFFFFF"/>
  <circle cx="120" cy="120" r="84" fill="none" stroke="#E9EDC6" stroke-width="2"/>
  <!-- bold forest-green checkmark -->
